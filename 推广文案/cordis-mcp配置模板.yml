# ═══════════════════════════════════════════════════════════════════════════
# 验证步骤
# ═══════════════════════════════════════════════════════════════════════════
# 1. 备份：Copy-Item cordis.patch.yml cordis.patch.yml.bak-manual
# 2. 追加条目到 cordis.patch.yml（YAML 缩进两层空格）
# 3. 预热（这台机器网络不稳，先手动跑一次避免启动超时）：
#      npx x-post-mcp
#    能正常挂起等 stdin 就说明包装好了；报缺 token 也正常
# 4. 重启 DSH
# 5. 看启动日志有没有 mcp-client(x-post) 的连接失败
# 6. 连上后工具名是 mcp__x-post__send_tweet，可以先发一条测试推
#
# 常见失败原因
#   - 变量名写错（x-post-mcp 用的是 X_BEARER_TOKEN，不是 X_API_KEY）
#   - scope 没勾 tweet.write → 发帖 403
#   - serverName 重复 → 报 "already in use"
#   - YAML 缩进错 → DSH 启动时解析报错
