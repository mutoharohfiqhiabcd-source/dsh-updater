# DSH 社媒 MCP 接入配置模板（已按各包源码校正）
#
# 用途：让 DSH 能直接发 Twitter/X 与 Facebook。
#
# 【校正记录】初版我按常见写法猜了环境变量名（X_API_KEY / X_ACCESS_TOKEN 等），
# 实测该包读的是别的名字，照猜的填必然连不上。现已从包内源码
# （node_modules 里 dist/index.js 的 process.env.*）逐一核实。
#
# 用前必读：
#   1. 本文件是**模板**，不要整个覆盖过去
#   2. 请把下面的条目**追加**到：
#        C:\Users\y'g'x'z\.dsh\profiles\web\cordis.patch.yml
#      （cordis.yml 本身只有一行 []，注释写明「Edit cordis.patch.yml」）
#   3. 改之前先备份那个文件 —— 它现在 522 行，是你所有自定义的集合
#   4. 密钥填好后**不要提交进任何 git 仓库**
#
# 字段依据：packages/mcp/mcp-client/src/index.ts 的 Config 定义
#   - transport 必填，取值 'stdio' 或 'streamable-http'（**不是** type）
#   - serverName 必填，格式 [A-Za-z0-9_-]{1,32}，同一时刻不能重名
#   - 工具会注册成 mcp__<serverName>__<原工具名>
#   - failOnStartupError 建议显式设 false，否则 MCP 连不上会连带 DSH 启动失败


# ═══════════════════════════════════════════════════════════════════════════
# 一、Twitter / X —— x-post-mcp（npm 包 1.1.0，MIT，零运行时依赖，仅 8.6KB）
# ═══════════════════════════════════════════════════════════════════════════
#
# 源码核实结果：
#   工具      send_tweet(text 必填, reply_to_tweet_id?, quote_tweet_id?)
#   环境变量  X_BEARER_TOKEN            ← README 的配置示例只用这一个
#             X_CLIENT_ID / X_CLIENT_SECRET / X_REFRESH_TOKEN   ← 代码里另有
#             一条 OAuth2 刷新流程会用到；不确定就走 Bearer 那条
#
# 怎么拿 X_BEARER_TOKEN：
#   1. https://developer.x.com/en/portal/dashboard
#   2. 新建 Project 与 App
#   3. 生成 **User Authentication Token**，scope 勾选：
#        tweet.read  ·  tweet.write  ·  users.read
#      （少勾 tweet.write 就只能读不能发）
#
- id: mcp-x-post
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    transport: stdio
    serverName: x-post
    command: npx
    args:
      - "x-post-mcp"
    env:
      X_BEARER_TOKEN: "在这里填你的 Bearer Token"
    toolCallTimeoutMs: 120000
    failOnStartupError: false


