name: Build & Release EXE

# 触发方式：
#   1) 推送形如 v1.0.0 / v1.0.1 的 tag 时自动构建并发布
#   2) 也可在 Actions 页面手动运行（workflow_dispatch）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows EXE (PyInstaller)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build onefile EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "DeepSeekHarnessUpdater" `
            --icon "dsh_updater.ico" `
            "updater_gui.pyw"

      - name: Compute SHA256
        shell: pwsh
        run: |
          $f = "dist\DeepSeekHarnessUpdater.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash
          "SHA256: $h" | Out-File -FilePath dist\SHA256.txt -Encoding ascii
          Get-Content dist\SHA256.txt

      # 源码版 zip：与本地用同一个脚本打包，保证两边内容一致。
      # 版本号由脚本自行从 updater_gui.pyw 读取，不依赖 tag 名。
      - name: Build source zip（源码版）
        run: python pack_source.py --outdir dist

      - name: Show build outputs
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekHarnessUpdater
          path: |
            dist/DeepSeekHarnessUpdater.exe
            dist/SHA256.txt
            dist/dsh-updater-src-v*.zip

      # 由 tag 触发时：把 EXE + 源码 zip 附加到对应 Release；没有 Release 则自动创建。
      # 说明正文取自仓库内的 RELEASE_NOTES.md，保证每次发布都有完整的中文更新说明
      # （此前用 generate_release_notes 只会生成一行 Full Changelog）。
      - name: Publish to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: dsh 自动更新 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/DeepSeekHarnessUpdater.exe
            dist/SHA256.txt
            dist/dsh-updater-src-v*.zip
          make_latest: true
          draft: false
          prerelease: false
